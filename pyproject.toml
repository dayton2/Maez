[project]
name = "maez"
version = "0.1.0"
description = "Time-series distribution-system analysis with DSS-Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dss-python>=0.15.7",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
]

[project.scripts]
maez-run = "maez.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maez"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 100
target-version = "py312"
